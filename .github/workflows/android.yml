name: Android Build
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      production:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TVE_REQUIRE_RELEASE_SIGNING: ${{ inputs.production && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Flutter SDK
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git .tools/flutter
          [[ "$(git -C .tools/flutter rev-parse HEAD)" == 737ba8f885dc774b53b442759999a312c9461e4e ]]
          echo "$PWD/.tools/flutter/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg without optional desktop packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Generate original demo fixtures
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node tools/generate-demo.cjs
          node tools/generate-v2-demo.cjs
      - name: Analyze and test
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p test_release_tools.py
          flutter pub get
          flutter analyze
          flutter test
      - name: Build and verify ARM64 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/tve-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            chmod 600 "$ANDROID_KEYSTORE_PATH"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            flutter build apk --release --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-release.apk "dist/TigerVideoEdit-$version-Android-arm64.apk"
            echo 'signing=production-key' > dist/build-info.txt
          else
            if [[ "$TVE_REQUIRE_RELEASE_SIGNING" == true ]]; then echo 'Production signing secrets missing'; exit 1; fi
            flutter build apk --debug --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/TigerVideoEdit-$version-Android-arm64-TEST-debug.apk"
            echo 'signing=debug-test-only' > dist/build-info.txt
          fi
          apk=$(find dist -name '*.apk' -print -quit)
          unzip -t "$apk"
          python -c "import zipfile; z=zipfile.ZipFile('$apk'); abis={n.split('/')[1] for n in z.namelist() if n.startswith('lib/')}; assert abis == {'arm64-v8a'}, abis"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          printf 'commit=%s\nflutter=3.47.8\nplatform=android-arm64\n' "$GITHUB_SHA" >> dist/build-info.txt
          python tools/release_integrity.py create dist
          python tools/release_integrity.py verify dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
